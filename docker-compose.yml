
version: '3.8'

services:
# Database service
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: josiah
      POSTGRES_PASSWORD: various
      POSTGRES_DB: cirql_social_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U josiah -d cirql_social_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  # Backend service
  backend:
    build: ./backend
    restart: always
    ports: 
     - "8000:8000"
    environment:
      DATABASE_URL: postgres://josiah:various@db:5432/cirql_social_db
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    
  # Frontend service
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:80"
    env_file:
      - ./frontend/.env.development
    depends_on:
      - backend

volumes:
  postgres_data: